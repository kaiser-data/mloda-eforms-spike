name: tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mloda==0.22.0" pyarrow lxml pytest
      # offline: the synthetic correction fixture; the real TED tests skip without data/xml
      - run: python -m pytest -q tests
      - run: python -I src/eforms_mloda.py tests/fixtures/correction 2026-11-25T11:01:00+01:00
      - run: python -I src/check_citations.py tests/fixtures/correction
